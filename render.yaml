# Render blueprint — the API on the free tier (docs 14).
#
# The worker is deliberately NOT here: Render's free plan sleeps after 15 minutes of no HTTP
# traffic, which would silently stop the pipeline. The worker belongs on a host that stays awake
# (an Oracle Always Free VM, a laptop, or GitHub Actions cron running `--once`). See
# docs/deployment.md.
services:
  - type: web
    name: jobsentinel-api
    runtime: docker
    plan: free
    region: singapore # closest free region to the user; the database is in ap-south-1
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Secrets are set in the Render dashboard, never in this file.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: AI_GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      # `*` (anyone may sign up) or a comma list of emails to restrict it (D93).
      - key: ALLOWED_SIGNUP_EMAILS
        sync: false
      # The deployed web URL, e.g. https://jobsentinel-ai.vercel.app (links in Telegram alerts).
      - key: APP_BASE_URL
        sync: false
      # Browser origins allowed by CORS — the deployed web URL, comma-separated if several. This
      # used to be listed as CORS_ORIGINS, which nothing reads, so CORS stayed on localhost (D89).
      - key: WEB_ORIGIN
        sync: false
      # Optional: a fine-grained GitHub token (Actions read+write, this repo only). The API then
      # starts the worker every 30 minutes, which GitHub's own schedule does not manage (D95).
      - key: WORKER_DISPATCH_TOKEN
        sync: false
      # Telegram pushes bot updates (a new user's `/start <code>`, commands, buttons) to the API's
      # /api/v1/telegram/webhook, registered on boot (D98). The API never long-polls.
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_POLLING
        value: 'false'
