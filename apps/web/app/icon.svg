<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="JobSentinel AI">
  <!-- Master icon. Every raster (favicon, app icons, preview image) is generated from this file
       by the web package's "icons" script; edit here, then regenerate. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b93ff"/>
      <stop offset="0.45" stop-color="#5b5cf0"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b" stop-opacity="0"/>
      <stop offset="1" stop-color="#1e1b4b" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3ff"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="facetLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="0.55" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
    <clipPath id="shieldClip">
      <path id="shieldPath" d="M256 100C300 124 346 134 378 136V248C378 330 324 384 256 412C188 384 134 330 134 248V136C166 134 212 124 256 100Z"/>
    </clipPath>
  </defs>

  <!-- Tile, with a glossy top and a darker floor so it reads as a lit, raised button -->
  <g clip-path="url(#tileClip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#tile)"/>
    <rect x="16" y="16" width="480" height="230" fill="url(#gloss)"/>
    <rect x="16" y="300" width="480" height="196" fill="url(#floor)"/>
  </g>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Soft contact shadow under the shield -->
  <ellipse cx="256" cy="430" rx="118" ry="20" fill="#0f0d3a" opacity="0.5" filter="url(#blur)"/>

  <!-- Shield: extruded side, then the face, then a lit left facet for the bevelled ridge -->
  <path d="M256 100C300 124 346 134 378 136V248C378 330 324 384 256 412C188 384 134 330 134 248V136C166 134 212 124 256 100Z" transform="translate(9 22)" fill="url(#side)"/>
  <path d="M256 100C300 124 346 134 378 136V248C378 330 324 384 256 412C188 384 134 330 134 248V136C166 134 212 124 256 100Z" transform="translate(4.5 11)" fill="url(#side)" opacity="0.85"/>
  <path d="M256 100C300 124 346 134 378 136V248C378 330 324 384 256 412C188 384 134 330 134 248V136C166 134 212 124 256 100Z" fill="url(#face)"/>
  <g clip-path="url(#shieldClip)">
    <rect x="134" y="96" width="122" height="320" fill="url(#facetLight)" opacity="0.55"/>
    <rect x="256" y="96" width="124" height="320" fill="#c7d2fe" opacity="0.32"/>
  </g>
  <path d="M256 100C300 124 346 134 378 136V248C378 330 324 384 256 412C188 384 134 330 134 248V136C166 134 212 124 256 100Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.9"/>

  <!-- Verified check, with its own drop for depth -->
  <path d="M192 260L238 304L322 214" fill="none" stroke="#064e3b" stroke-opacity="0.28" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 8)"/>
  <path d="M192 260L238 304L322 214" fill="none" stroke="url(#check)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI sparkle -->
  <path d="M392 72C396 98 404 106 430 110C404 114 396 122 392 148C388 122 380 114 354 110C380 106 388 98 392 72Z" fill="url(#spark)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3"/>
</svg>
