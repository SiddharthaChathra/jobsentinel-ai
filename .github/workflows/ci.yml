name: CI

on:
  push:
    # Phase branches too, so a feature is proven in CI before it is merged (D101).
    branches: [main, 'phase-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No `version:` here: package.json's `packageManager` pins pnpm, and action-setup refuses to
      # run when both are given ("Multiple versions of pnpm specified"), which failed every run.
      - uses: pnpm/action-setup@v4
      # 24, not 22: htmlparser2 (via sanitize-html) ships ESM only, and Jest can load ESM from a
      # CommonJS test only on Node >= 24.9 — on 22 two API suites fail to load. The runtime images
      # stay on 22, where Node itself loads it (Render serves this code on 22).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packages first: the type-aware lint rules resolve @jobsentinel/* through their built
      # `dist` typings. Linted before the build, every import is an error type (1121 errors on a
      # fresh checkout; a dev machine only passes because its packages are already built).
      - run: pnpm -r --filter './packages/*' build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Public, non-secret placeholders. Without a Supabase URL the app pages are prerendered
          # statically and the browser client throws at build time; any well-formed value keeps
          # them dynamic, exactly as on Vercel. Nothing connects to it during the build.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  e2e:
    name: API e2e + browser (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public identifier of the production project (it is in every page's Supabase URL). Named
      # so the test guard refuses it explicitly, on top of refusing anything non-local (D101).
      PRODUCTION_SUPABASE_REF: hktrhvorwsymventjhfu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' build
      # A throwaway Supabase (Postgres, Auth, Storage) in Docker on the runner. Nothing here can
      # reach production: the stack is local and .env.test is generated from it (F1, D101).
      - run: pnpm test:db:start
      - run: pnpm test:db:seed
      - run: pnpm test:e2e
      # Browser tests (F9) on the same local stack: the real web app and API, with no AI key
      # (deterministic fallbacks), no bot token and seeded jobs instead of sources. Chromium
      # only and no retries, so a flaky test fails visibly; traces are uploaded on failure.
      - run: pnpm --filter @jobsentinel/api build
      - run: pnpm --filter @jobsentinel/e2e exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
      - if: always()
        run: pnpm test:db:stop
