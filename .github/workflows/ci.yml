name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No `version:` here: package.json's `packageManager` pins pnpm, and action-setup refuses to
      # run when both are given ("Multiple versions of pnpm specified"), which failed every run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r --filter './packages/*' build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @jobsentinel/api test:e2e
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Public, non-secret placeholders. Without a Supabase URL the app pages are prerendered
          # statically and the browser client throws at build time; any well-formed value keeps
          # them dynamic, exactly as on Vercel. Nothing connects to it during the build.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
