# The worker as a scheduled job — the zero-cost option when no always-on host is available
# (docs 14). Each run is one full pipeline tick and exits.
#
# Trade-off worth knowing: GitHub's schedule is best-effort and can be delayed by 10+ minutes
# under load (the API starts it every 30 minutes instead, D95). The worker does not read the
# bot's messages: Telegram pushes them to the API's webhook (D98), so linking and commands work.
name: worker

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated source ids to scan (blank = all due)'
        required: false

concurrency:
  # Two ticks at once would contend for the same job leases. They would be safe — leases use
  # SKIP LOCKED — but pointless, so a run in progress wins.
  group: worker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `@jobsentinel/api...` = the API and what it depends on. The old `!@jobsentinel/web...` also
      # excluded everything web depends on — which now includes @jobsentinel/types — so zod was
      # never installed and every scheduled tick failed at the build (D88).
      - run: pnpm install --frozen-lockfile --filter '@jobsentinel/api...'
      - run: pnpm --filter '@jobsentinel/api...' build

      - name: Run one tick
        working-directory: apps/api
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_GEMINI_API_KEY: ${{ secrets.AI_GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          # Without these the Adzuna adapter disables itself, and with it most India sources.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Long polling needs a long-lived process; a scheduled tick has none.
          TELEGRAM_POLLING: 'false'
          # Auto-pause (D104) is OFF until the owner confirms the would-pause list: the worker
          # logs what it would pause and still sends India-scoped alerts, but pauses nothing.
          # Set to 'true' to enable. Thresholds: AUTO_PAUSE_MIN_COLLECTED / _WINDOW_DAYS.
          AUTO_PAUSE_ENABLED: 'false'
        run: node dist/worker.js --once ${{ inputs.sources && format('--sources={0}', inputs.sources) || '' }}
