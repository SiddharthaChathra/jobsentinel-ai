# Backup for the API's own keep-awake ping (D94). GitHub runs free scheduled jobs best-effort —
# this fired 4 times in 12 hours instead of 72 — so the API now pings itself; this stays as a
# second line of defence. Original purpose (D92): keep Render's free plan from falling asleep.
#
# A free Render instance spins down after 15 minutes without inbound requests, and the next
# visitor then waits 30-60 s while it boots — every signed-in page asks the API first, so the
# whole site looks broken. A request every 10 minutes keeps it awake. Running all month uses
# ~744 of the workspace's 750 free instance-hours, which leaves nothing for a second free service,
# so the API is kept awake only 07:00-24:00 India time (KEEP_AWAKE_HOURS on Render, D99) and this
# job follows the same hours. It is also what wakes the API when the window opens: a sleeping
# process cannot ping itself. GitHub can delay scheduled runs, so a cold start remains possible.
name: keep-api-warm

on:
  schedule:
    # 07:00-24:00 IST = 01:30-18:30 UTC.
    - cron: '30-59/10 1 * * *'
    - cron: '*/10 2-17 * * *'
    - cron: '0-20/10 18 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health check
        # /health, not /health/ready: waking the service is the point, and a database hiccup
        # should not turn this job red.
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 \
            -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' \
            https://jobsentinel-api-sg.onrender.com/health
